# ShellCraft CI: tests on Linux and Windows across the supported Pythons, lint, the module
# checker, a packaging smoke test (build the wheel, install it into a clean venv, run it), and the
# docs website on GitLab Pages (the `pages` job).

stages: [check, test, package, deploy]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths: [.cache/pip]

.python: &python
  image: python:3.14
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

lint:
  <<: *python
  stage: check
  script:
    - ruff check shellcraft tools tests main.py
    - mypy shellcraft tools || true  # informational until the annotation debt is paid

modules:
  <<: *python
  stage: check
  script:
    - python tools/ingest check --all --strict

test-linux:
  stage: test
  image: python:$PYTHON
  parallel:
    matrix:
      - PYTHON: ["3.11", "3.12", "3.13", "3.14"]
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - pytest -q

test-windows:
  stage: test
  tags: [windows]  # needs a Windows runner with Python 3.12+ on PATH
  rules:
    - if: $WINDOWS_RUNNER == "true"
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - pytest -q

package:
  <<: *python
  stage: package
  script:
    - python -m build --wheel
    - python -m venv /tmp/smoke
    - /tmp/smoke/bin/pip install --quiet dist/*.whl
    - /tmp/smoke/bin/shellcraft --version
    - /tmp/smoke/bin/python -c "import importlib.util as u; assert u.find_spec('shellcraft.commands') and u.find_spec('shellcraft.bundled_modules')"
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# The docs website: docs/ built with MkDocs (mkdocs.yml) into public/, which GitLab Pages serves at
# the project's Pages URL (Deploy > Pages). Needs Pages turned on for this GitLab server.
pages:
  image: python:3.14
  stage: deploy
  variables:
    NO_MKDOCS_2_WARNING: "true"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [docs/**/*, mkdocs.yml, requirements-docs.txt, tools/mkdocs_hooks.py, .gitlab-ci.yml]
  script:
    - pip install -r requirements-docs.txt
    - mkdocs build --strict --site-dir public
  artifacts:
    paths: [public]

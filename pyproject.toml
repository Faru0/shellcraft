[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellcraft"
version = "0.1.0"
description = "A modular, pipe-friendly Python shell with Rich output and an embedded MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0.40",
    "rich>=13.7",
    "mcp>=2.0,<3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
censys = ["censys-platform>=0.16"]  # for the queryCensys module

[project.scripts]
shellcraft = "core.cli:main"

[tool.setuptools]
# The bundled modules/ folder is installed as core/bundled_modules (with its .md and .skill files),
# so a plain `pip install .` works as well as an editable install.
packages = ["core", "core.commands", "core.bundled_modules"]

[tool.setuptools.package-dir]
"core.bundled_modules" = "modules"

[tool.setuptools.package-data]
"core.bundled_modules" = ["*.md", "*.skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

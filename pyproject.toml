[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellcraft"
dynamic = ["version"]
description = "A modular, pipe-friendly Python shell with Rich output and an embedded MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0.40,<3.1",
    "rich>=13.7",
    "mcp>=2.0,<3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]
censys = ["censys-platform>=0.16"]  # for the queryCensys module

[project.scripts]
shellcraft = "core.cli:main"

[tool.setuptools.dynamic]
version = {attr = "core.__version__"}

[tool.setuptools]
# The bundled modules/ folder is installed as core/bundled_modules (with its .md and .skill files),
# so a plain `pip install .` works as well as an editable install.
packages = ["core", "core.commands", "core.bundled_modules"]

[tool.setuptools.package-dir]
"core.bundled_modules" = "modules"

[tool.setuptools.package-data]
"core.bundled_modules" = ["*.md", "*.skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["Install", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "SIM108", "SIM102", "B007", "B905", "UP007", "UP035", "UP038", "B008", "SIM117", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["core", "tools", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["Install/", "docs/", "templates/", "modules/"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellcraft"
dynamic = ["version"]
description = "A modular, pipe-friendly Python shell with Rich output and an embedded MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0.40,<3.1",
    "rich>=13.7",
    "mcp>=2.0,<3",
    "requests>=2.31",
    "pyte>=0.8.2",                                   # the terminal emulator behind `sub` (one screen per subshell)
    "pywinpty>=2.0; platform_system == 'Windows'",   # ConPTY for `sub PROGRAM` on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]
keyring = ["keyring>=24"]  # API keys in the OS keyring instead of plain text in config.json
censys = ["censys-platform>=0.16"]  # for the queryCensys module

[project.scripts]
shellcraft = "shellcraft.cli:main"
shellcraft-alert = "shellcraft.alerts:main"

[tool.setuptools.dynamic]
version = {attr = "shellcraft.__version__"}

[tool.setuptools]
# The bundled modules/ folder is installed as shellcraft/bundled_modules (with its .md and .skill files),
# so a plain `pip install .` works as well as an editable install.
packages = ["shellcraft", "shellcraft.commands", "shellcraft.bundled_modules", "tools", "tools.ingest"]

[tool.setuptools.package-dir]
"shellcraft.bundled_modules" = "modules"

[tool.setuptools.package-data]
"shellcraft.bundled_modules" = ["*.md", "*.skill"]
"tools.ingest" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["Install", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "SIM108", "SIM102", "SIM105", "SIM114", "B007", "B023", "B905", "UP007", "UP035", "B008",
          "SIM117", "E731"]

[tool.ruff.lint.per-file-ignores]
"tools/ingest/__main__.py" = ["E402"]  # sys.path is set up before the imports
"tools/**" = ["E501"]
"tests/**" = ["E501"]
"shellcraft/commands/*.py" = ["E501"]  # man pages hold Markdown tables, whose rows can't wrap

[tool.ruff.lint.isort]
known-first-party = ["shellcraft", "tools", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["Install/", "docs/", "templates/", "modules/"]
